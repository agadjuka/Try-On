services:
  bot:
    container_name: vyon-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/run/secrets/gcp-sa.json:ro
      # SQLite: файл на хосте ~/bot_project/data/vyon.db (удобно копировать по SCP)
      - ./data:/code/data

